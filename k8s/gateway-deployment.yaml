apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: capstone-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
            - containerPort: 9876
          env:
            - name: PORT
              value: "4000"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:4001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:4002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service:4003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4004"
            - name: FRONTEND_SERVICE_URL
              value: "http://frontend:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30400
    - name: admin
      port: 9876
      targetPort: 9876
      nodePort: 30976
